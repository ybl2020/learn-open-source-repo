name: Validate Skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate skill structure
        run: python3 scripts/validate_skill.py skill

      - name: Check repository scanner syntax
        run: bash -n skill/scripts/inspect_repository.sh
